[package]
name = "forge-11-demo"
version = "0.1.0"
edition = "2021"
description = "SolverForge demoscene (forge_11): describe, generate, solve and repair a real agent session, in textmode on glyphfx"

[[bin]]
name = "forge-11-demo"
path = "src/main.rs"

[dependencies]
# Pixel framebuffer window
minifb = "0.28"

# Audio output (the track itself is synthesized by hand in src/audio)
cpal = "0.17"

# glyphfx (vendored once for every demo), text cells, the 8x8 font, the logo
demofx = { path = "../vendor/demofx" }
