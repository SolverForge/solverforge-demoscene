  ctx.fillStyle='rgba(10,8,7,0.6)';ctx.fillRect(0,0,W,H);
  for(let i=0;i<160;i++){const x=hash(i*7+3)*W,y=hash(i*13+5)*H;ctx.fillStyle=`rgba(255,226,176,${.08+.25*hash(i*17+1)})`;ctx.fillRect(x,y,2,2);}

  spaced('BORN IN 1982 · LIVING IN BERGAMO',462,22,rgb(WARM));

  const off=document.createElement('canvas');off.width=w;off.height=h;
  const o=off.getContext('2d');o.drawImage(img,0,0,w,h);
  o.globalCompositeOperation='destination-in';
  const fx=o.createLinearGradient(0,0,w,0);fx.addColorStop(0,'rgba(0,0,0,0)');fx.addColorStop(.14,'#000');fx.addColorStop(.86,'#000');fx.addColorStop(1,'rgba(0,0,0,0)');

  const fy=o.createLinearGradient(0,0,0,h);fy.addColorStop(0,'rgba(0,0,0,0)');fy.addColorStop(.05,'#000');fy.addColorStop(.95,'#000');fy.addColorStop(1,'rgba(0,0,0,0)');
  o.fillStyle=fy;o.fillRect(0,0,w,h);
