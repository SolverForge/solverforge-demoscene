[package]
name = "routing-10-demo"
version = "0.1.0"
edition = "2021"
description = "SolverForge demoscene: HERMES_09 -- the SolverForge Planner plugin for Hermes Agent, framing a live Desktop take"

[[bin]]
name = "routing-10-demo"
path = "src/main.rs"

[dependencies]
# Pixel framebuffer window
minifb = "0.28"

# Audio output (the track itself is synthesized by hand in src/audio)
cpal = "0.17"

# glyphfx (vendored once for every demo), the 8x8 font, story cards, the logo
demofx = { path = "../vendor/demofx" }
