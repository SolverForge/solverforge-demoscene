[package]
name = "serio-demo"
version = "0.1.0"
edition = "2021"
description = "SolverForge Demoscene: SERIO — Musica Universalis"

[[bin]]
name = "serio-demo"
path = "src/main.rs"

[dependencies]
# Pixel framebuffer window
minifb = "0.28"

# Audio synthesis + output
fundsp = "0.23"
cpal = "0.17"


# The star of the show: SERIO incremental scoring engine
solverforge-scoring = "=0.5.2"
solverforge-core = "=0.5.2"

# glyphfx (vendored once for every demo) and the story cards
demofx = { path = "../vendor/demofx" }
