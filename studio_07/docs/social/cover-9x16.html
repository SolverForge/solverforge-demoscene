function portrait(x0,y0,pitch){
  const x1=x0+PW*pitch, y1=y0+PH*pitch;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x0-14,y0-14,x1-x0+28,y1-y0+28);
  ctx.strokeStyle=rgba(LIME,.55);ctx.lineWidth=2;ctx.strokeRect(x0-14,y0-14,x1-x0+28,y1-y0+28);
  ctx.strokeStyle=rgba(LIME,.2);ctx.strokeRect(x0-8,y0-8,x1-x0+16,y1-y0+16);
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const lum=PIX[y*PW+x]/255, edge=Math.min(x,y,PW-1-x,PH-1-y), keep=Math.min(1,edge/5);
    const ink=Math.pow(lum,1.2)*keep; if(ink<.04)continue;
    const r=.5*pitch*Math.sqrt(ink)*1.05;
    ctx.fillStyle=rgba(LIME,.55+.45*ink);ctx.beginPath();ctx.arc(x0+(x+.5)*pitch,y0+(y+.5)*pitch,r,0,7);ctx.fill();}
}
function compose(){
  ctx.fillStyle='#020503';ctx.fillRect(0,0,W,H);
  for(let y=16;y<H;y+=32)for(let x=16;x<W;x+=32){ctx.fillStyle=rgba(LIME,.07);ctx.fillRect(x,y,2,1);}
  glow(540,800,460,LIME,.07);
  plate(230,330,.75);
  title('STUDIO','_07',262,15);
  spaced('VITTORIO DISTEFANO',410,34,'#e6eef7');
  spaced('ENGINEER · FOUNDER OF SOLVERFORGE',462,22,rgb(GOLDC));
  const pitch=4.3, px=Math.round(540-PW*pitch/2);
  portrait(px,540,pitch);
  plate(1110,520,.9);
  ptextC('FOUR WAYS TO WORK WITH ME',W/2,1150,4,rgb(LIME));
  const ow=Math.max(...OFFERS.map(([t])=>ptextWidth('1 '+t,3))), ox=Math.round((W-ow)/2);
  OFFERS.forEach(([t,c],i)=>{const s=(i+1)+' '+t;ptext(s,ox,1230+i*62,3,rgb(c));});
  ptextC('HELLO@SOLVERFORGE.AI',W/2,1500,4,rgb(LIME));
  ptextC('VDISTEFANO.STUDIO  ·  SOLVERFORGE.ORG'.replace('·','-'),W/2,1560,3,rgb(PAPERC,.85));
  footer('A PIXEL DEMO IN RUST + GLYPHFX');
}
run(compose);
