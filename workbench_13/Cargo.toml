[package]
name = "workbench-13-demo"
version = "0.1.0"
edition = "2021"
description = "SolverForge demoscene: WORKBENCH_13 -- a factory week planned, broken by a late delivery and repaired with the SolverForge Workbench for Hermes Agent"

[[bin]]
name = "workbench-13-demo"
path = "src/main.rs"

[dependencies]
# Pixel framebuffer window
minifb = "0.28"

# Audio output (the track itself is synthesized by hand in src/audio)
cpal = "0.17"

# glyphfx (vendored once for every demo), the 8x8 font, story cards, the logo
demofx = { path = "../vendor/demofx" }

[profile.release]
# One unit with link-time optimisation, so the per-pixel helpers from demofx
# inline into the frame loops: a frame has to fit in 16.6 ms in the window.
lto = "fat"
codegen-units = 1
